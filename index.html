<!DOCTYPE html>

  <!-- welcome screen artwork (blood moon + torii silhouette): fetched right away so the intro never starts empty -->
  <!-- only for visitors who will actually see the intro (it plays once per session) -->
  <script>
    try {
      if (sessionStorage.getItem("welcomeSeen") !== "1" && location.pathname === "/") {
        ["/Blood-Moon.webp", "/Torii-Gate-sm.webp"].forEach(function (href, i) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.type = "image/webp";
          link.href = href;
          if (i === 0) link.setAttribute("fetchpriority", "high");
          document.head.appendChild(link);
        });
      }
    } catch (e) {}
  </script>

  <!-- Open the connection to the database early: the hero's stats come from there -->
  <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
